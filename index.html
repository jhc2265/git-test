<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업로드 테스트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Malgun Gothic", sans-serif;
      background: #12141a;
      color: #e8e8ea;
    }

    .card {
      padding: 48px 56px;
      border: 1px solid #2a2d36;
      border-radius: 16px;
      background: #1a1d25;
      text-align: center;
    }

    h1 { font-size: 28px; margin-bottom: 12px; }

    .check {
      display: block;
      font-size: 56px;
      margin-bottom: 20px;
    }

    p { color: #9296a3; line-height: 1.7; }

    code {
      padding: 2px 6px;
      border-radius: 4px;
      background: #262a34;
      color: #7dd3a0;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      margin-top: 24px;
      padding: 6px 16px;
      border-radius: 999px;
      background: #1f3a2c;
      color: #7dd3a0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .link {
      display: inline-block;
      margin-top: 18px;
      color: #7dd3a0;
      text-decoration: none;
      border-bottom: 1px solid #2f5c46;
      padding-bottom: 2px;
    }

    .link:hover { color: #a5e6c1; }

    .stamp {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #2a2d36;
      font-size: 13px;
      color: #656a78;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="check">✅</span>
    <h1>업로드 성공!</h1>
    <p>
      이 페이지가 보인다면<br>
      <code>깃허브에 올리기.bat</code> 이 정상 작동한 겁니다.
    </p>
    <p class="badge">5차 테스트 · 새로고침</p>
    <p><a class="link" href="about.html">소개 페이지 보기 →</a></p>
    <p><a class="link" href="기록.html">테스트 기록 보기 →</a></p>
    <p class="stamp">git-test · 테스트용 페이지</p>
  </div>
</body>
</html>
